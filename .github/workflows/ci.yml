name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build RezenBackup.slnx -c Release
      - name: Test
        run: dotnet test tests/RezenBackup.Tests -c Release --no-build --logger "console;verbosity=normal"
        env:
          # Exercises DPAPI on Windows runners (the item is deleted again by the test).
          REZEN_KEYCHAIN_TEST: ${{ matrix.os == 'windows-latest' && '1' || '0' }}

  package-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build MSI (unsigned)
        shell: pwsh
        run: ./installer/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RezenBackup-windows
          path: artifacts/windows/*.msi

  package-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build app and dmg (unsigned)
        run: ./installer/macos/build-app.sh arm64
      - uses: actions/upload-artifact@v4
        with:
          name: RezenBackup-macos
          path: artifacts/macos/arm64/*.dmg
